save_dir: '/home/ericxhzou/Code/PCGL-Benchmark/exp/pr'
debug: False
data:
  num_points: 4096
  dataset_folder: '/home/ericxhzou/Code/PCGL-Benchmark/pickles'
  aug_mode: 0
  pin_memory: False
model:
  name: 'EgoNN'
  quantization_type: 'cartesian'  # cartesian / polar
  quantization_size: 0.01  # 0.01 / [1.0,0.3,0.2]
  feature_size: 256
  output_dim: 256
  planes: [32,64,64]
  layers: [1,1,1]
  num_top_down: 1
  conv0_kernel_size: 5
  normalize_embeddings: True
train:
  aug_mode: 0
  memory:
    num_pairs: 0
  num_workers: 8
  batch_size: 32
  batch_size_limit: 256
  batch_expansion_rate: 1.4
  batch_expansion_th: 0.7
  optimizer:
    lr: 0.001
    weight_decay: 0.0001
    scheduler: 'MultiStepLR'
    scheduler_milestones: [80]
    epochs: 160
  g_loss:
    name: 'BatchHardTripletMarginLoss'
    margin: 0.2
  l_loss:
    name: 'KeypointCorrLoss'
    gamma_chamfer: 1.0
    gamma_p2p: 1.0
    gamma_c: 1.0
    beta: 4.0
eval:
  aug_mode: 0
  rotate_theta: 0.0  # make sense when aug_mode = 2
  batch_size: 256
  thresh_min: 0
  thresh_max: 1
  num_thresholds: 1000
  similarity: 'euclidean'
  save_desc: True
protocol: '/home/ericxhzou/Code/PCGL-Benchmark/config/pr/protocol.yaml'