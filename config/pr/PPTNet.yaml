save_dir: '/home/ericxhzou/Code/PCGL-Benchmark/exp/pr'
debug: False
data:
  num_points: 4096
  dataset_folder: '/home/ericxhzou/Code/PCGL-Benchmark/pickles'
  aug_mode: 0
  pin_memory: False
model:
  name: 'PPTNet'
  aggregation: 'spvlad'
  feature_size: [256,256,256,256]
  max_samples: [64,256,1024,4096]
  cluster_size: [1,4,16,64]
  output_dim: [256,256,256,256]
  sampling: [1024,256,64,16]
  knn: [20,20,20,20]
  group: 8
  gating: True
  normalize_embeddings: True
train:
  aug_mode: 0
  memory:
    num_pairs: 0
  num_workers: 4
  batch_size: 16
  batch_size_limit: 80
  batch_expansion_rate: 1.4
  batch_expansion_th: 0.7
  optimizer:
    lr: 0.0005
    weight_decay: 0.0
    scheduler: 'StepLR'
    scheduler_step_size: 10
    scheduler_gamma: 0.2
    epochs: 30
  g_loss:
    name: 'BatchHardTripletMarginLoss' # BatchHardTripletMarginLoss / Quadruplet
    margin: 0.2
    lazy: True
    margin1: 0.5
    margin2: 0.2
eval:
  aug_mode: 0
  rotate_theta: 0.0  # make sense when aug_mode = 2
  batch_size: 200
  thresh_min: 0
  thresh_max: 1
  num_thresholds: 1000
  similarity: 'euclidean'
  save_desc: True
protocol: '/home/ericxhzou/Code/PCGL-Benchmark/config/pr/protocol.yaml'